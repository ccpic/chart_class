# Apache 2.4 虚拟主机配置
# Chart Class Web API 反向代理配置
# 
# 使用方法:
# 1. 将此文件复制到 Apache conf/extra/ 目录
# 2. 在 httpd.conf 中添加: Include conf/extra/apache_vhost.conf
# 3. 修改 ServerName 和 ServerAlias 为您的域名
# 4. 如果使用 HTTPS，配置 SSL 证书路径
# 5. 测试配置: httpd -t
# 6. 重启 Apache: httpd -k restart

# HTTP 虚拟主机配置
<VirtualHost *:80>
    # 修改为您的域名
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    
    # 日志配置
    ErrorLog "logs/chart_class_error.log"
    CustomLog "logs/chart_class_access.log" combined
    
    # 反向代理到 FastAPI
    ProxyPreserveHost On
    ProxyRequests Off
    
    # 代理所有 API 请求到后端
    ProxyPass /api http://127.0.0.1:8001/api
    ProxyPassReverse /api http://127.0.0.1:8001/api
    
    # WebSocket 支持（如果未来需要）
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/(.*) ws://127.0.0.1:8001/api/$1 [P,L]
    
    # 超时设置（图表渲染可能需要较长时间）
    ProxyTimeout 300
    
    # 请求体大小限制（如果需要上传大文件）
    LimitRequestBody 104857600
</VirtualHost>

# HTTPS 虚拟主机配置（如果使用 SSL）
<VirtualHost *:443>
    # 修改为您的域名
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    
    # SSL 配置
    SSLEngine on
    # 修改为您的 SSL 证书路径
    SSLCertificateFile "conf/ssl/your-domain.crt"
    SSLCertificateKeyFile "conf/ssl/your-domain.key"
    # 如果有证书链文件
    # SSLCertificateChainFile "conf/ssl/your-domain-chain.crt"
    
    # SSL 协议和加密套件配置（推荐配置）
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5
    
    # 日志配置
    ErrorLog "logs/chart_class_ssl_error.log"
    CustomLog "logs/chart_class_ssl_access.log" combined
    
    # 反向代理配置（同上）
    ProxyPreserveHost On
    ProxyRequests Off
    
    ProxyPass /api http://127.0.0.1:8001/api
    ProxyPassReverse /api http://127.0.0.1:8001/api
    
    # WebSocket 支持
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/(.*) ws://127.0.0.1:8001/api/$1 [P,L]
    
    # 超时设置
    ProxyTimeout 300
    
    # 请求体大小限制
    LimitRequestBody 104857600
</VirtualHost>

# 注意: 确保以下 Apache 模块已启用（在 httpd.conf 中取消注释）:
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule rewrite_module modules/mod_rewrite.so
# LoadModule headers_module modules/mod_headers.so
# LoadModule ssl_module modules/mod_ssl.so (如果使用 HTTPS)

